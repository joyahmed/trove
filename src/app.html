<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trove</title>
    <script>
      // Paint the right theme on the first frame: settings load later, so a new window would flash
      // the OS theme first. use-theme stores the CHOICE (system, light or dark) under this key;
      // System is resolved here, so an OS flip between launches still paints right.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('trove-theme');
        } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          // 'system', nothing stored, or junk: ask the OS now
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        // `data-os="macos"` gates the Mac-only frosted-glass rules in app.css, set here so the
        // first frame already has it. Rust's init script (`platform_init_script`) runs first.
        var p = window.__TROVE_PLATFORM__;
        if (p && p.os === 'macos') document.documentElement.dataset.os = 'macos';
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="h-screen overflow-hidden">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
